<!doctype html>
<html class="h-full" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Coverland Workbench</title>
    <link rel="icon" href="/media/app/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Coverland Workbench 공개 프로토타입 — 팀별 대시보드, 업무 요청, 승인 및 진행 이력."
    />
    <meta property="og:title" content="Coverland Workbench" />
    <meta
      property="og:description"
      content="Connected teams. Clear workflows. 팀 업무를 연결하는 공개 프로토타입."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://coverland-workbench.coverland-9381.chatgpt.site/og.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coverland Workbench" />
    <meta
      name="twitter:description"
      content="Connected teams. Clear workflows. 팀 업무를 연결하는 공개 프로토타입."
    />
    <meta
      name="twitter:image"
      content="https://coverland-workbench.coverland-9381.chatgpt.site/og.png"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700"
    />
    <style>
      .dark body {
        background-color: hsl(240 10% 4%);
      }
    </style>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          const isDarkMode =
            theme === 'dark' || (theme === 'system' && prefersDark);
          if (isDarkMode) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="text-foreground bg-background flex h-full text-base antialiased">
    <div class="flex grow" id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
